entries:
  - address: П-96
    title: "Ранчо «Боб и сыновья»"
    portrait: ranch.jpg
    text: |
      Ранчо почти не изменилось, несмотря на смену владельцев несколько месяцев назад. Услышав громкий стон ваших тормозных колодок, из дома выходит мужчина, вытирающий руки.

      — Детективы? Да, конечно, расскажу… Я утром пошел обход делать: овечки уже проснулись… Так, проверить, в порядке ли ограда, не случилось ли чего — стандартные вещи. Слышу — конь. Поворачиваюсь, смотрю — человек с седла свесился! У меня зрение хорошее, увидел. Ну, метрах в ста, наверное. Под холмом. Откуда? Да кто его знает, с юга откуда-то. Я тут же бегу в конюшню, вытаскиваю Вашингтона, коня своего, говорю Биллу — это наш младший — отпирай ворота, мол! Но так, чтобы Вашингтон не завёлся. Скачем наперерез, но спокойно. Тот конь был нервный, но ухоженный. Я его за удила хватаю, останавливаю. Начинаю соображать, как я и коня, и мужика удержу-то… Потом смотрю — у него дырка в голове, аккурат в глазе… Ну, думаю, вестерн, тоже мне… Озираюсь тут, откуда мог прийти, да не понять. Сколько конь его в седле тащил — тоже не смог понять: тот хорошо застрял. Машу рукой Биллу, тот приехал на мотоцикле, увидел труп, побелел… В общем, довезли мы обоих до ранчо и сразу позвонили в полицию.

      Мужчина выдыхает.

      — Ничего из того, что у него было, мы не трогали. Лицо знакомое вроде… А так — кто его знает, кто это вообще. В карманах не рылся: не по-христиански это. А вот откуда конь взялся — вопрос интересный. Они вообще с тавром обычно-то, да у этого не могу понять, чьё стоит. Вроде колос в щите, не знаю. Тавро — это клеймо такое. Какие могут быть варианты? Ну, конечно же, конезавод… Ферма любая может быть, хотя этот, кажется, не рабочий. С ипподрома мог бы быть, но не сказать, что скакун… Жирноват. Музеи, может быть, ещё? Здесь есть в пригороде… Коренных этих и первых колонистов. Ну… Так-то всё. Да не за что.

      Вы осматриваете территорию вокруг ранчо: холмы и леса. Понять, откуда появился ваш всадник, кажется, будет непросто.

  - address: Ю-38
    title: "Центр судебной медицины"
    portrait: wallis.jpg
    appendices: [5, 10]
    text: |
      — И я взглянул, и вот, конь бледный, и на нем всадник, которому имя «смерть», — приветствует вас Уоллис. — Откровение 6:8. Полагаю, вы за ним? — смеётся коронер. — Пройдёмте в морг. Полагаю, вы хотите на него посмотреть. Лицо у него какое-то знакомое…

      Уоллис ищет в папке нужный отчёт, напевая что-то себе под нос.

      — Вот, читайте, смотрите. Здесь коробка с его вещами. Я, как обычно, всё написал, но спешу обратить ваше внимание на пулю, которая его убила. Должен сказать, пуля вошла неглубоко. Достаточно глубоко, чтобы убить, но после таких ранений, бывало, и выживали. Не в этом случае, к сожалению. Пулю вы находите в баночке, осматривая ящик с вещами покойного. Пуля действительно покорёженная. Одежда покойного — хорошего кроя. И она, и ботинки не очень подходят для езды верхом. К лацкану пиджака приколота головка тёмной гвоздики с белой лентой. В кошельке нет удостоверения личности, но есть около ста пятидесяти долларов. Расчёска, сигареты «Стеллион» в портсигаре, пачка салфеток. Бросив последний взгляд на разложенные перед вами вещи, вы складываете их обратно в ящик.

  - address: ЮВ-44
    title: "Театр оперетты"
    portrait: lloyd.jpg
    text: |
      Вы показываете документы и попадаете в служебные помещения. Поднявшись по узкой лестнице на второй этаж, вы стучите в дверь, как вам подсказал кто-то из персонала. За ней слышны голоса.

      — Ну, пришёл?! — слышите вы вместо «войдите».

      В комнате находятся три человека: мужчина за столом, мужчина помоложе и девушка. При виде вас лицо старшего мужчины каменеет.

      — Не говорите мне, что с Джонатаном что-то стряслось!

      Вы показываете мужчине фотографию, которую вам вручил Стоун. Он садится. Девушка прикрывает рот рукой, а второй мужчина закрывает глаза ладонью. Придя в себя, мужчина берётся за трубку телефона, бросая на вас взгляд.

      — Извините, я должен всех известить. Отель «Звездный лес»? Соедините с номером 402, пожалуйста… Спасибо. Роджер? Джонатана убили. Скажи остальным. Не знаю. Только что пришли, показали фотографию. Да какой фокус, идиот, убили!

      Пока мужчина разговаривает по телефону, второй мужчина спрашивает у вас, уверены ли вы в том, что Джонатан мёртв. Вы киваете. Первый мужчина вешает трубку.

      — Да, простите, это потрясение… Вы что-то ещё от нас хотите? Да, полагаю, хотите… Конечно. Меня зовут Майкл Ллойд, я — менеджер Джонатана. Это Леонард, он наш осветитель и главный по звуку. Это Моника, она — ассистент, одна из.

      Моника дрожащим голосом говорит: — Извините, я не могу. Это всё… Я поеду в гостиницу. Мне надо выпить. Если хотите со мной поговорить, приезжайте туда.

      Она выходит.

      — Ну… Так вот. Джонатан… Мы приехали в город на гастроли, у нас здесь тур. Позавчера. Где он был эти два дня — я без понятия. Он всегда куда-то пропадает. Кто это мог быть? Да кто угодно! Он был пьян? Нет, поймите, Джонатан — очень прагматичный и расчётливый человек, но его стремление произвести впечатление иногда выходит за рамки его профессиональной деятельности! Лео, ты знаешь, где он вообще был? Нет? Да никто не знает!

      Леонард добавляет:

      — Его помощник, Роджер, может знать… Он тоже в гостинице. Ещё у нас водитель есть, он там же… И человек для грима и прочего…

      — Послушайте, это сложно. Оставьте номер… Если ещё что-то полезное вспомним, мы позвоним. А сейчас я хочу последовать примеру Моники и выпить. Лео, скажешь местным, что шоу не будет? Вы выходите из кабинета вместе с Леонардом.

      — Не знаю, чем помочь… У него разве что ещё местный промоутер был, Люк Нельсон. Может, он что-то знает. Работает в вашей башне этой, в «Тауэре», которая с офисами. Пятьдесят первый кабинет у него. Уфф… Извините меня.

  - address: С-12/51
    title: "Престонс Тауэр — Промоутер"
    portrait: nelson.jpg
    appendices: [4]
    text: |
      Большой лифт, украшенный разноцветной плиткой и зеркалами, привозит вас на нужный этаж.

      — Добрый день. По поводу кого вы? Джонатан мертв? Боги… Ну, я к этому отношения имею мало, конечно, он не был под моей ответственностью, но это, конечно, ужасно. Где он был — я знаю крайне условно. Я занят рекламой и продвижением. Плакаты, агентства, радио — вот это всё. Могу дать вам его райдер, который мне прислали заранее. Нужно? Держите! Я, кстати, договаривался об аренде лошади на его имя. Он вообще Браун, Джонатан Браун. На ячменной ферме брал: там знакомые, можно подешевле договориться. Мы ещё с заведениями долго договаривались: с лаунджами, театрами — ну, с обычными местами для этого, фокусники всегда в таких работают. Лаунджи особенно. В итоге подошёл только театр оперетты… А, вы уже знаете? Да. Ну, обращайтесь, если ещё что-то понадобится.

  - address: П-48
    title: "Ячменная ферма"
    portrait: hordigrow.jpg
    appendices: [1]
    text: |
      Проезжая под деревянной аркой перед входом на ферму, вы замечаете табличку, на которой изображён контур щита с колоском.

      — Лошади в аренду? — переспрашивает работница фермы. — Взял у нас один коня, но так и не вернул. Залог там, конечно, солидный… Если с нашим красавцем что случится — ухх… Хотя Антуану не впервой: он домой вернётся, если что не так. Умный мальчонка, поумнее некоторых, да и проворный. Кто ещё брал? Ну, у нас нередко арендуют, сейчас… — вы проходите в другое помещение, и вам показывают список.

  - address: П-51
    title: "Конный завод «Кейндрафт»"
    portrait: keindraft.jpg
    appendices: [2]
    text: |
      Вы проезжаете мимо огромной подковы и попадаете на территорию завода. Вы интересуетесь, можно ли здесь взять лошадь в аренду.

      — Мы, конечно, не прокат, но всегда можно договориться, — улыбается вам сотрудник.

      Вы спрашиваете, «договаривался» ли кто-нибудь об аренде в последнее время.

      — Да, конечно. Всех лошадок вернули, никаких проблем. Или вас интересует кто-то конкретный?

      Чтобы получить информацию о человеке из списка, введите его номер через слеш после адреса завода. Например: П-51/11

  - address: П-51/87
    title: "Ответ"
    text: |
      — А, этот господин? Да, помню его! Он приехал на машине, похоже, со своим приятелем. Один был седой, в хорошей одежде, а второй — с высоким лбом, сам тоже высокий… И усы ещё такие, слегка пижонские. Они оставили машину здесь, а сами оседлали по лошади и по второй взяли под уздцы. Что за машина? О, Понтиак аметистового цвета, броский такой, мы им даже любовались какое-то время. У него ещё был какой-то простой номер… Две пары цифр. Каких же… Вот не помню. Может, с этим набором данных вам кто-то знающий и поможет, конечно. Выглядели господа весьма компетентными в вопросе езды верхом, так что я не беспокоился. Да, вернули вчера около семи часов вечера, никаких проблем не было.

  - address: ЮВ-38
    title: "Ипподром"
    portrait: racetrack.jpg
    text: |
      Услышав ваш вопрос об аренде лошадей, сотрудник, похоже, делает над собой усилие, чтобы не покрутить пальцем у виска.

      — Господа, здесь лошади стоят, натурально, целое состояние. Ни один владелец и не подумает о подобном. К тому же где здесь вне заведения кататься? Нет, это вам за город. Тавро? У нас другое.

  - address: Ц-13
    title: "Департамент регистрации транспортных средств"
    portrait: registry-clerk.jpg
    requires: [П-51/87]
    appendices: [9]
    text: |
      — А, приветствую. Вижу, вы ко мне не чай зашли, не так ли? — невесело усмехается сотрудник. — Ну, чего желаете, джентльмены?

      Вы описываете машину, которую видели на конном заводе, и вас просят подождать.

      — Ох, ну что с вами делать, сейчас посмотрю… — вздыхает работник и удаляется в лабиринт картотеки.

      Вскоре он возвращается и протягивает вам документ.

      — Понтиак — не самая популярная машина, так что вам повезло. Вот, ведём списки как раз для таких случаев.

  - address: Ц-46/3
    title: "Белл Гарри"
    portrait: bell.jpg
    text: |
      Подъехав к многоквартирному дому в дорогом районе и поднявшись на второй этаж, вы останавливаетесь рядом с дверью из красного дерева и нажимаете на кнопку звонка. Вам открывает владелец.

      — Да? Полиция? Моё почтение. Чем могу помочь? Вчера вечером? Какое это имеет значение? Лошади в аренду? Нет, не брал. Видели автомобиль? С моим номером? Обознались. Или где-то ещё его видели: у меня много дел и клиентов, — говорит он, надевая пиджак. — Господа, я — адвокат, своё дело знаю. Я, к сожалению, не могу сейчас уделить вам время. Если у вас есть какие-то вопросы — присылайте повестку на допрос. Простите, спешу на встречу, — он выходит из квартиры вместе с вами.

  - address: СЗ-37
    title: "Гостиница «Звёздный лес»"
    portrait: starwood-admin.jpg
    text: |
      Чтобы поговорить с администратором, вы вынуждены подождать, пока какая-то дама закончит скандалить по поводу чистоты простыней в её номере.

      — Извините, тяжёлый день, — улыбается молодой администратор. — Добро пожаловать! Какой у вас номер?

      Вы сообщаете, что пришли по другому поводу.

      — О, и вправду так себе день… Сейчас. Вот, у них всех бронь на один и тот же период была, заехали одновременно.

      Вам протягивают журнал, в котором обведены имена и номера постояльцев:

      Джонатан Джун: СЗ-37/504 Метью Кокс и Вильям Сталлард: СЗ-37/216 Моника МакКой: СЗ-37/215 Роджер Шеффилд: СЗ-37/402 Леонард Баддс и Майкл Ллойд: СЗ-37/214 — Если вы захотите узнать, видел ли персонал что-нибудь необычное, то позвоните мне: Ц-48/5001. Я попробую найти для вас информацию, — добавляет администратор.

  - address: СЗ-37/504
    title: "Номер Джонатана"
    text: |
      Лифтёр желает вам хорошего дня, и вы выходите на нужном вам этаже. Среди множества одинаковых дверей вы находите нужную.

      Этот обыск проще, чем многие другие: определить, что является частью интерьера отеля, а что — личными вещами, не составляет труда. Под кроватью вы обнаруживаете открытый чемодан, в нём — по одному комплекту уличной одежды и одежды для выступления. Зажигалка, маникюрные ножницы.

      На столе стоит графин с водой. Ящик стола закрыт не до конца. В нём вы находите разве что брошюры отеля и достопримечательностей Сейнт-Твинс. На тумбочке лежит красивая автоматическая ручка, но бумагу вы не находите.

      Содержимое шкафа также самое обычное: ещё одна сумка, в которой, кажется, были книги, валяющиеся сейчас на полу. В основном это труды по физике.

  - address: СЗ-37/216
    title: "Номер Метью и Вильяма"
    portrait: cox-stallard.jpg
    text: |
      В этом номере на двоих находятся два понурых мужчины.

      — Да, господа, тяжелая ситуация. Надо будет отменять гастроли и новую работу искать. Чёрт-те что творится. Мистер Джун был человеком, любящим вокруг себя создать видимость сенсации…

      — Но на деле он был крайне прагматичен, — добавляет второй. — Все свои фокусы он очень тщательно охранял: возил с собой дневники, в которых всё по сантиметрам расписано. Вся магия — это просто инженерия.

      — Может, из-за этого его и убили. Яркий был, не боялся врагов завести: для него важнее всего было впечатление произвести. Это такой способ о себе заявить… Среди своих-то он всегда был спокойным.

      — Даже скучным. А как он умер-то?

      Вы сообщаете об огнестрельном ранении.

      — Вот те на… А пистолет его был при нём? У него был такой особый пистолет, для фокусов… Из «Кольта» классического, семизарядный, сорок пятый калибр. Никогда с ним не расставался, разве что когда спал.

      — Да, но он всегда был холостыми заряжен. Конечно, можно и холостым убиться: разрывная волна, газы… Сильно ударит вблизи. Пистолет я всегда заряжал, но в нём правда были всегда только холостые…

      — Если его лошадь потащила, может, выронил где… Не знаю, что и сказать ещё.

      — Да, я тоже. Удачи вам с расследованием.

  - address: СЗ-37/215
    title: "Номер Моники"
    text: |
      Из короткого разговора с Моникой становится понятно, что она уже пьяна. Несмотря на лёгкие протесты, вы осматриваете её номер, но не находите ничего полезного.

  - address: СЗ-37/402
    title: "Номер Роджера"
    portrait: sheffield.jpg
    text: |
      Мужчина выглядывает из-за двери, как будто заслоняя своей спиной обзор комнаты.

      — Да, мне уже сказали! Это катастрофа. Послушайте, я не знаю, кто вас на нас натравил. Вдруг вы на этого Маззарри работаете? Нет, я вам ничего не покажу и не скажу. У вас документы есть? Что? Вот это? Это просто удостоверение. Ну нет, я свои права знаю! Я Джонатана не убивал и отношения к этому не имею! Даже не смейте так думать! Бог мне судья, от меня вы ничего не получите!

      Перед вами захлопывается дверь.

  - address: СЗ-37/214
    title: "Номер"
    text: |
      В номере находятся личные вещи двух мужчин. Ничего интересного вы не обнаруживаете.

  - address: Ц-48/5001
    title: "Стойка администратора"
    text: |
      — Алло, да? Ключи мы вам все дали, всё откроем… Вы хотите, чтобы я поспрашивал у сотрудников, не видели ли они что-нибудь? Хорошо. Через некоторое время вам перезванивают:

      — Да, вы знаете, на этаже мистера Джуна видели молодого мужчину с густой шевелюрой, очень серьёзного, заходил к нему в номер недавно, буквально за 10 минут до вашего приезда. Кажется, из его труппы. Больше ничего подозрительного не видели…

  - address: В-89
    title: "Клуб «Линдси Лаундж»"
    portrait: lindsey-manager.jpg
    text: |
      — У нас огромное количество номеров… Кто именно вас интересует? Если вы хотите получить информацию о конкретном человеке, введите его полный сценический псевдоним без пробелов через слеш после адреса клуба, например: В-89/загадочныйджулиан

  - address: В-89/маэстромаззарри
    aliases: [В-89/маззарри]
    title: "Ответ"
    text: |
      — А, да, это наш местный… Майкл Джералд его настоящее имя. Но не сообщайте его никому… Это всё же профессиональная тайна. Вам по работе положено. А зачем он вам? Думаете, был знаком с вашим убитым? Ну, может, и был: их не так уж и много в штате, здесь вам не Нью-Йорк.

  - address: З-42
    title: "Джералд Майкл"
    portrait: gerald.jpg
    text: |
      Маэстро Маззарри живёт в достаточно скромном доме.

      — Добрый день. Что? Мёртв? Я? Что? Чёрт подери! Что, меня уже забирают в полицию? Не забирают? — удивляется Майкл. — Э-э-э… Хорошо… Заходите тогда, наверное…

      Вы проходите внутрь. В доме пахнет пылью и лаком.

      — Са-садитесь, — задумчиво говорит фокусник. — Я даже не знаю, с чего начать и как сделать так, чтобы меня не посадили, — он поднимает на вас взгляд. — Нет, поймите, я не считаю, что сделал что-то незаконное! Давайте, всё сначала расскажу. Я знаком с Джонатаном два года. На одном… светском рауте, на котором присутствовало немалое количество важных лиц, Джонатан решил самоутвердиться за мой счёт. Он каким-то образом узнал секрет одного из моих фокусов… Того, который с исчезновением совы. То ли украл, то ли сам разобрался — не знаю. И решил меня разоблачить, объяснив всем, что моя магия — это фарс, тогда как его — настоящая. Чушь, конечно, но это произвело на публику должное впечатление. Кажется, умные люди, но все эти артисты — как дети, ей-богу… Меня это, надо сказать, задело. Сильно. Мало того, что он не местный и лезет не в своё дело, так ещё и ведёт себя так нагло!

      Майкл сдавливает пальцами переносицу, закрыв глаза, и выдыхает.

      — Я тогда решил, что отомщу. Это так работает в нашей индустрии: всё держится исключительно на шоу, на грандиозном разоблачении. Когда я узнал, что будут его гастроли в Сейнт-Твинс, решил за ним проследить… Хотел найти на него что-нибудь. Мне надо было как-то ему ответить! Должен сказать, следить за ним не очень сложно: он настолько громкий, что только ленивый его не заметит. Ему это нравится. Нравилось, видимо. В общем… Я начал следить за ним у аэропорта. Вся труппа заселилась в «Звёздный лес». Он взял такси и поехал на восточный променад. Туда на авто не попасть, поэтому там я его потерял. Но я догадался, что он может быть в джаз-клубе! Я не видел, как он заходил, но видел, как покинул его в сопровождении дамы. Опять такси — до отеля «Амбассадор». На следующий день, около двух, он поехал на ячменную ферму. Оттуда поскакал на коне на юг, к кладбищу. И там встретился с другими всадниками. Вот здесь я растерялся. Все на конях! И поскакали они куда-то в лес. Я подумал, что дальше я никак не проеду. Мы с Мелвином Стейлсом, моим помощником, остановились. Я ему говорю, мол, доставай фонарь, дальше мы пойдём пешком! Пока шли, я соображал, куда они могли в лес-то ускакать. Зачем приличным людям вообще так делать? Тут я вспомнил. Старая железнодорожная станция есть в лесу, на заброшенной ветке. А куда ещё им-то скакать? Где? Я отмечу вам на карте. П-00/ЖД. Пока мы туда добрались, их и след простыл. Ну, если честно, я не знаю, были ли они там, но я нашёл пистолет. Достал магазин — посмотреть: патронов в нём на два меньше было. Подумал, что он может иметь к ним отношение. Взял зачем-то с собой. А потом Мелвин уговаривал, ныл, что, мол, а вдруг убили кого, надо бы выбросить. Ну, мы и спрятали на кладбище, в склепе. Вообще не помню, где именно. А теперь вы говорите, что его застрелили. В целом-то гнусно. Но я к этому отношения не имею. Поймите, у меня и мотива-то нет! Как мне отыграться на нём, если он мертв? Мне же нужно показать себя в лучшем свете…

      Майкл смотрит на вас и сообщает, что, если потребуется, он приедет в участок и даст показания ещё раз.

  - address: ЮЗ-70
    title: "Стэйлс Мелвин"
    portrait: stayles.jpg
    text: |
      Мелвин трёт глаза.

      — Уже? Полиция? Вот пусть великий фокусник сам теперь меня отмазывает… Да что рассказывать! Я его возил весь день, пока он мне по ушам своим Джонатаном ездил, как в фильме про детективов! «Стой, не подъезжай так близко, он нас заметит»! «Что ты делаешь, мы его упустим»! И так весь день! Потом поехали за город, и этот Джун лошадь взял. Ну, думаю, труба, заметит. А он, если и заметил, значения не придал. Вроде даже рукой помахал! А мы в гриме… Как два идиота! «Чтобы не опознали»… У леса мы его потеряли. Он встретился с кучкой людей недалеко от кладбища, они и поехали… Потом Маззарри погнал нас с фонарями в лес… Дошли до станции, начали осматриваться. Там был подвал… В нём нашли пистолет под тряпкой — явно кто-то спрятал. Не спрашивайте, как нашли… Просто нашли. Я ему всю дорогу на мозги капал, чтобы он от пистолета избавился! В итоге он согласился и выбросил. Где? Да на кладбище. Зашли и начали петлять, Майкл… Маззарри носился туда-обратно. В итоге мы зашли в склеп на большом участке, недалеко от такой круглой дорожки. Ну, кругом идёт. Вот там и оставили.

  - address: В-62
    title: "Ресторан «Моби Дик»"
    portrait: moby-dick.jpg
    text: |
      — Джонатан Джун? А, тот фокусник? Да, — метрдотель кивает, — был такой позавчера. Пришли четыре человека. Три джентльмена, в числе был которых Джун, и очаровательная леди. Они забронировали столик на втором этаже: вид оттуда особенно хорош. Они заказали…

      Вы интересуетесь, как долго здесь были эти гости и не заметил ли метрдотель что-нибудь подозрительное.

      — Отнюдь. Очень приятные клиенты, все бы такими были… Куда потом отправились? Не знаю насчёт тех двух господ, но мистер Джун, кажется, говорил, что давно не слушал местный джаз и хочет немного пройтись. Его спутница эту идею, похоже, поддержала.

  - address: В-77
    title: "Джаз-клуб «77»"
    portrait: jazz77-barman.jpg
    appendices: [11]
    text: |
      Едва перешагнув порог, вы сразу же погружаетесь в густую саксофонную музыку с аккомпанементом пианино. На сцене трое: саксофонист, пианист и барабанщик. Музыка течёт медленно и густо, как будто пытается запечатать в себе время, как в янтаре. В зале тихо, так как посетителей сейчас мало. Вы подходите к бару, где немного светлее и громче.

      — Что желаете, джентльмены? — интересуется мужчина и уже тянется за стаканом, но вы сообщаете, что пришли сюда не для этого. — Одиннадцатого? Да, была моя смена. Джун? А, да, я видел его в газете, — кивает бармен и начинает вытирать стойку. — Заходил такой, верно. С дамой. Знаете, бывают такие женщины… Красивые, но, кажется, тронешь и иллюзия растворится. Эта фея выпила один коктейль «Голубые Гавайи» и очень убедительно изображала, что слушает этого парня. После пары коктейлей он заказал такси до «Амбассадора», — работник кивает на телефонный аппарат, стоящий на краю стойки. — Заметил ли я что-нибудь необычное? Ну… А, едва они вышли, сюда заглянул какой-то брюнет с рыжими усищами. Спросил, ушли ли эти двое, и тут же убежал. Описать? Уфф. Ну, думаю, могу. Подождите, только сменщика позову.

      Бармен едет с вами в полицию, и через некоторое время вы получаете фоторобот.

  - address: Ц-56
    title: "Амбассадор Резорт Инн 5*"
    portrait: ambassador.jpg
    text: |
      — О, вы знаете, у нас вчера останавливался этот гастролирующий фокусник! Джонатан Джун, магистр магии! Позавчера, точнее, а вчера утром выехал. С дамой… Блондинка, красивая такая. Могу показать вам его комнату.

      Вы осматриваете номер, который ничем не отличается от других.

      — Ну, я даже не знаю… Могу только сказать, что у нас была здесь дежурная и точно никто не ходил по отелю ночью. Посторонних мы не пускаем. В номере уже прибрались, поэтому личных вещей здесь не будет. Могу только в мусоре предложить поискать… Спустя пятнадцать минут копания в дурно пахнущем контейнере на улице вы достаёте бутылку какого-то эксклюзивного шампанского с очень широким горлышком и слышите, что в ней что-то звенит. Посмотрев сквозь бутылку на свет, вы обнаруживаете патрон. Вам приходится разбить бутылку, чтобы его извлечь. Сорок пятый калибр. Холостой.

  - address: П-98
    title: "Южное кладбище"
    portrait: cemetery-keeper.jpg
    appendices: [3]
    text: |
      — Вчера? Хм… А, ну да. Во второй половине дня видел несколько человек. Около пяти часов, полагаю. Таких сложно не заметить: трое прискакали на конях, а ещё двое пешком пришли. Они собрались около часовни, — кивает сторож в сторону колокольни. — Я их иногда тут вижу. Соберутся вдвоём-вчетвером и куда-то едут. Проблем не доставляют, на вид приличные люди. И что? В полицию звонить, потому что у меня тут рядом с кладбищем живые люди ходят? Ходят и ходят — мне-то что. Вчера их было пятеро. Всех не запомнил. Не особо интересовался. Один был молодой, ухоженный, с причёской аккуратной, ещё был один такой повыше, с усами, как у голливудских этих, начала века. И ещё был один. Хмм. Точно! Ядловски его фамилия! Такую не перепутаешь, точно. Они здесь с неделю назад свою тётку хоронили, кажется. Много людей было, дорогая церемония. Вот имени паренька не знаю, к сожалению. Остальных не запомнил, простите.

      Если вам нужно посетить конкретную могилу, то укажите её номер через слеш после адреса кладбища, например: П-98/00.

  - address: П-98/28
    title: "Склеп"
    text: |
      В усыпальнице, украшенной каменными барельефами, вы осматриваете пыльные углубления.

      Из одного из них вы извлекаете пистолет. Кольт М1911 сорок пятого калибра. В обойме на семь патронов вы обнаруживаете пять. Больше полезных выводов вы сделать не можете, поэтому потребуется заключение эксперта.

  - address: П-98/28/криминалист
    title: "Экспертиза"
    text: |
      Вы привозите пистолет на экспертизу. Хоупса на месте нет, но другой криминалист сообщает вам, что, судя по следам в дуле, из пистолета был произведён боевой выстрел.

  - address: П-00/ЖД
    title: "Заброшенная ЖД станция"
    text: |
      Вы едете, подпрыгивая на ухабах, вдоль заброшенной ветки железной дороги. С обеих сторон на вас давят плотные стены леса. На некоторых участках дороги вы замечаете чёткие следы подков. Должно быть, ночью этот маршрут мог бы сойти за декорацию к какому-нибудь готическому роману. Примерно через пятнадцать минут вы подъезжаете к старой железнодорожной станции. Пустынное заросшее место молчит. Около полусгнившей лачуги станции возвышается столб с колоколом, покрывшимся толстым слоем пыли и ржавчины. При свете дня хорошо видно, что земля истоптана копытами, как будто недавно здесь происходило «противостояние у салуна Коралл». Вы выходите из машины и осматриваете территорию. Вскоре вы замечаете под ногами бурые пятна и коричневые комки. Неподалёку вы обнаруживаете две гильзы, закопавшиеся в песок.

      В здании станции всё покрыто пылью и песком. Пройдя мимо кассы и крошечной комнаты, выполняющей роль зала ожидания, откуда уже утащили всё, что плохо стояло, вы замечаете люк. Петли подаются на удивление легко, и перед вами открывается тёмный прямоугольник, в который ведёт узкая крутая лестница. Удивительно, но на ней нет ни пыли, ни песка. Внизу вы обнаруживаете небольшое помещение с кирпичными стенами, украшенными портретами мужчин, сделанными в середине прошлого столетия.

  - address: П-00/ЖД/криминалист
    title: "Осмотр места"
    appendices: [7]
    text: |
      Криминалист приезжает с ассистентом. Кажется, это тот самый парень, с которым вы разговаривали по телефону во время расследования убийства Макгратов. Чтобы пробраться через лес, они воспользовались списанным внедорожником «Виллис» времён Второй мировой.

      Вы наблюдаете, как они тщательно и аккуратно изучают территорию. Поднимают вещи палками, делают снимки. Спустя час ползанья, тыканья и ведения записей Хоупс подходит к вам.

      — Держите. Я бы пояснил, но мы потратили достаточно времени на дорогу. Вот копия. Изучайте. Нашли, что смогли.

  - address: В-58
    title: "Джон Ядловски"
    portrait: yadlovski.jpg
    text: |
      — Да? Добрый день… Вы по какому вопросу? Ох, боги, — мужчина оглядывается по сторонам и сглатывает. — Я всё расскажу, хорошо… Я хотел присоединиться к братству. Оно так и называется… «Братство». Что-то вроде масонской ложи, только это бывшие колонисты-железнодорожники. А на самом деле всего лишь безобидный клуб для влиятельных людей. Зачем? Связи, контакты, общие дела. Так вот… Мы встретились у кладбища в пригороде… У того, которое на юге. Они были на лошадях. Мне и Максу, как он представился при встрече у кладбища, завязали глаза, посадили нас на лошадей, и мы поскакали. Это длилось долго, около часа. По лесу. Представил меня всей этой братии Лайонел Кох. Он тоже в этом участвовал. Всего нас было пятеро. Я, Макс, Кох, ещё один мужчина и покойник… В общем, собирались провести обряд посвящения. Мы приехали на какую-то железнодорожную станцию в лесу. Где? Да не знаю я… говорю же, нам глаза завязали! У них был порядок посвящения. У Коха, кажется. Точно было известно, что сначала я, потом — Макс. Обряд там такой… Становишься, значит, под колокол. Потом тебе читают отрывок из Библии. А один, тот, который умер, целится в тебя из пистолета, сидя верхом. Испугался сначала, что убьют… Потом понял, что это такой тест на доверие. Он стреляет, надо мной колокол звенит. Потом — поздравления, и всё на этом. Ну, в общем, со мной всё в порядке было. А потом выводят Макса. Тут я вижу, что этот незнакомый седой мужчина с палкой за колоколом стоит и по нему бьёт, когда стреляют. Видимо, они договорились делать это на каком-то конкретном слове из зачитываемого отрывка. Ну, этот бьёт в колокол во время выстрела, да только слышно было два звука, а потом видим: стрелявший этот падает почти с коня. Ерунда какая-то! Его конь взбесился и ускакал. Темнело уже… Кто-то бросился за ним. Макс кричал, что это покушение и всем нужно оставаться на своих местах. Мол, он со всеми разберётся. Голос у него был страшный… Пистолет нашли. Мне сказали, чтобы я его отнёс в подвал, я и отнёс. Потом вернулся всадник, который пытался догнать коня, и сказал, что не получилось: лес, темно. Мы договорились, что подождём новостей от Макса… Он какой-то важной шишкой оказался. А теперь вы здесь…

  - address: Ю-35
    title: "Кох Лайонел"
    portrait: koch.jpg
    text: |
      Роскошный дом, кажется, принадлежит одному из представителей местной власти.

      Вас впускает дворецкий, когда вы показываете свои документы.

      — Что вам нужно? Да, брал лошадей. Мы с друзьями устроили конную прогулку. Послушайте, вам здесь делать нечего. Я влиятельный человек, и если вы не хотите проблем, то идите своей дорогой.

  - address: В-48
    title: "Макс Хардман"
    portrait: hardman.jpg
    text: |
      На этой улице большая часть домов выглядит очень ухоженно.

      Автопарк также намекает на то, что уровень достатка их владельцев выше среднего. Дверь открывает темнокожая горничная и щурится, рассматривая вас.

      — Вы знаете, господин сейчас никого не принимает. Вы можете оставить свои контакты.

      После сообщения о том, что вы — частные детективы, работающие с полицией, раздаётся мужской голос. К вам выходит хозяин дома.

      — Да? О, полиция, наконец-то. Так, стойте, вас кто прислал? А-а-а, нет, так не пойдёт. Вы по какому вопросу? Мне обещали людей, которые точно в курсе конкретной ситуации и уже были на месте событий. Это, кажется, не вы. Разбирайтесь у себя, а я, пожалуй, подожду.

      *Кажется, мистер Хардман ждёт людей, которые знают, где он вчера был. Укажите адрес этого места через слеш после адреса мистера Хардмана, например: В-48/АБ-12

  - address: В-48/П-00/ЖД
    aliases: [В-48/П00ЖД]
    title: "Макс Хардман"
    portrait: hardman.jpg
    text: |
      Когда вы сообщаете о вчерашней прогулке по лесу хозяину дома, он приглашает вас внутрь.

      — Виски? Прошу. Меня пытались убить. Однозначно. Я хотел присоединиться к Братству железнодорожников. Это просто закрытый клуб для влиятельных людей. Опасная затея. Началось всё благородно. Хотели выехать на лошадях в лес и так далее. В общем, меня посадили на ящик под колоколом. Этот фокусник на коне выстрелил, пока читалась Библия. И тут в него прилетел рикошет, иначе я это описать не могу. Колокол звякнул, конь поскакал. В меня стреляли из заряженного пистолета, других вариантов быть не может. Они вряд ли идиоты: стрелять по колоколу боевыми патронами, ещё и рядом с человеком…

      К тому же у посвящаемого до меня таких проблем не было. Завязался спор. Я сказал, что сам разберусь. У меня был при себе пистолет. Сказал, что не побоюсь им воспользоваться. В полиции я обратился к своим контактам, чтобы разобрались. Всё же речь идёт об угрозе политической карьере. Покушение, смерть, тайные общества — это скандал. Займитесь расследованием, пожалуйста. Я уверен, что меня кто-то заказал. Вот вам аванс. И за молчание. В конверте лежат три тысячи долларов. Берите, не стесняйтесь.

  - address: Ц-30
    title: "Городская мэрия"
    portrait: city-hall.jpg
    text: |
      — Да, вы знаете, накануне был небольшой скандал… Мистер Хардман, заместитель мэра, вчера не появился. Он должен был присвоить звание почётного гражданина города Доминику Кингу. Вы уже, наверное, читали об этом в газете… Говорят, у него, у мистера Хардмана, в мэрии появился какой-то противник, который всячески пытается навредить его карьере, чуть ли не убить. Может быть, конечно, это просто слухи… Имя? Нет, никто не знает его имени… Наверное, у мистера Хардмана появились какие-то обстоятельства, которые помешали ему посетить церемонию.

  - address: Ю-88
    title: Книжный магазин «Атлантик» — Шелли Кеннет
    text: |
      Шелли Кеннет, не поднимая глаз от книги, выслушивает вас.

      — Журналы аренды, говорите? Снова вымышленные имена. Документы у нас почти нигде не спрашивают — пиши кого хочешь. Ищите людей не по именам, а по внешности. И по машинам.

searches:
  - address: Ц-46/3
    title: "Гарри Белл"
    order_text: "Вы запрашиваете ордер на обыск квартиры Гарри Белла. Это займёт некоторое время."
    text: |
      Вооружившись ордером, вы вновь звоните и, тактично отодвинув горничную, которая открывает вам дверь, входите внутрь. Ваше внимание привлекает костюм, к лацкану которого прикреплена тёмная гвоздика. Такую же вы видели среди вещей покойного. Брюки костюма и сапоги покрыты слоем относительно свежей грязи. На ваш вопрос о том, где искать мистера Белла, горничная отвечает, что мистер Белл не сообщил, куда отправился.

  - address: СЗ-37/402
    title: "Обыск номера Роджера"
    order_text: "Вы запрашиваете ордер на обыск гостиничного номера. Это займёт некоторое время."
    appendices: [6]
    text: |
      Получить бумагу занимает какое-то время, но, учитывая поведение ассистента, эти усилия вполне можно считать потраченными не зря. Вы снова стучите в номер, но вам никто не открывает. Попросив сотрудника отеля помочь, вы заходите внутрь.

      Кажется, постояльца и след простыл: одежды нет, туалетных принадлежностей тоже.

      На столе вы находите некоторое количество корреспонденции. Если Роджер был в номере Джонатана и забрал его документы, можно предположить, что унёс он самое ценное — инструкции по выполнению фокусов, оставив здесь только эти письма. Среди писем от фанатов, адресованных Джонатану Джуну, магистру магии, вы находите также одно личное письмо.

  - address: Ю-35
    title: "Кох Лайонел"
    order_text: "Вы запрашиваете ордер на обыск дома Лайонела Коха. Это займёт некоторое время."
    appendices: [8]
    text: |
      Вы показываете ордер дворецкому. Вас снова пропускают внутрь.

      — Что вы здесь забыли? Я же сказал, чтобы вы убирались к чертям собачьим… Ордер? Кхм.

      Мужчина опускается в своё кресло и ждёт. Спустя двадцать минут поисков, вы обнаруживаете письмо в его столе. Лайонел вскакивает и бросается к маленькой тумбочке, из которой достаёт пистолет. К вашему счастью, дворецкий отнимает оружие до того, как Лайонел успевает приставить его к виску.

      — Господа, я не знаю, что на него нашло. Помогите мне, — обращается к вам дворецкий.

      Вы игнорируете крики и протесты хозяина дома и изучаете письмо.

triggers:
  - id: lloyd-call
    address: ЮВ-44/звонок
    title: "Звонок из театра оперетты"
    delay_sec: 60
    after_all: [ЮВ-44]
    after_any: [СЗ-37, СЗ-37/504, СЗ-37/216, СЗ-37/215, СЗ-37/402, СЗ-37/214, Ц-48/5001]
    text: |
      В вашем авто загорается лампочка на установленном полицией радио.

      — Алло? Алло, слышно? Вы там как будто на дне колодца. Это Ллойд, менеджер Джонатана. Я тут подумал. У него был какой-то безумный конкурент, причём ваш, местный. Ну как конкурент… Джонатан однажды повздорил с ним… Алло, слышно? Джонатан как-то с ним поругался… Из-за женщины, кажется. Короче, тот его обещал уничтожить, карьеру обрушить и так далее. Может, проверите этого, а? Как зовут? Псевдоним сценический только знаю… Маэстро Маззарри. Спросите у кого-нибудь, кто в курсе, где такие выступают. Если ещё что-то вспомню — дам знать.

hints:
  - id: horse
    text: "Многое поймёте, узнав, откуда конь. А может, вы знаете, кто этот человек? Он кажется знакомым."
    auto_minute: 30
    note: "Подсказка из оригинальной игры."
  - id: horses-count
    text: "У станции следы пяти лошадей. Все ли кони взяты на одной ферме?"
    auto_minute: null
    note: "Дополнительная, не из оригинала. Выпускать вручную, если команды застряли."
  - id: names
    text: "Имена в журналах аренды бывают вымышленными. Ищите людей по внешности и по машинам."
    auto_minute: null
    note: "Дополнительная, не из оригинала. Повторяет совет информатора Ю-88."

rubric:
  - n: 1
    answer: "Джонатан Джун (настоящее имя Джонатан Браун), гастролирующий фокусник."
    full: "Имя."
  - n: 2
    answer: "Убить хотели не его. Лайонел Кох хотел, чтобы фокусник «случайно» убил заместителя мэра Макса Хардмана, и заранее подставил фокусника (черновик статьи)."
    full: "Цель — Хардман + подстава фокусника."
  - n: 3
    answer: "Собственный «Кольт» M1911 .45 Джуна: один холостой патрон заменён боевым; пуля срикошетила."
    full: "Пистолет Джуна + боевой патрон + рикошет."
  - n: 4
    answer: "Заброшенная ж/д станция в лесу (П-00/ЖД), у колокола, во время обряда посвящения."
    full: "Станция + колокол/обряд."
  - n: 5
    answer: "Лайонел Кох."
    full: "Кох."
  - n: 6
    answer: "Блондинка в «Амбассадоре» ночью подменила холостой патрон на боевой (холостой — в бутылке из-под шампанского). При выстреле в Хардмана пуля срикошетила от рельса и колокола и попала Джуну в правый глаз."
    full: "Подмена патрона + рикошет в глаз."
  - n: 7
    answer: "Письмо Братства → ужин в «Моби Дике» с дамой → джаз-клуб «77» → ночь в «Амбассадоре», подмена патрона → ферма, конь Антуан → сбор у Южного кладбища → станция: посвящение Ядловски (холостой), затем Хардмана (боевой) → рикошет → конь принёс тело на ранчо."
    full: "Цепочка от приглашения до выстрела."
  - n: 8
    answer: "Опасность — Хардману (заказчик на свободе). Привлечь: Коха (организатор); Гарри Белла (соучастник: «Понтиак», кони, бил в колокол); блондинку (подмена патрона); Маззарри (Майкла Джералда) и Стэйлса (спрятали орудие); Роджера Шеффилда (кража записей фокусов); членов Братства (скрыли смерть, спрятали пистолет)."
    full: "Все по именам. Без Белла и явного «членов Братства» — минус баллы."

debrief: |
  Закрытое «Братство» — клуб влиятельных людей, «бывших колонистов-железнодорожников» — собирается в подвале заброшенной железнодорожной станции в лесу (П-00/ЖД). Знак членов — тёмная гвоздика на лацкане. Братство письмом пригласило своего «брата», гастролирующего фокусника Джонатана Джуна (настоящее имя — Джонатан Браун), провести обряд посвящения: посвящаемый стоит под колоколом, читают Библию, Джун верхом стреляет из своего «Кольта» холостыми, седой брат бьёт палкой в колокол. Посвящались Джон Ядловски и заместитель мэра Макс Хардман.

  Лайонел Кох, соперник Хардмана в мэрии, решил убить его руками фокусника. Он знал порядок обряда: первым Ядловски, вторым Хардман. 11 мая Джун ужинал в «Моби Дике» с двумя джентльменами и блондинкой — той самой «занимательной особой» из письма, — потом был с ней в джаз-клубе «77» и провёл ночь в «Амбассадоре». Пока Джун спал (с пистолетом он расставался только во сне), второй холостой патрон в «Кольте» заменили боевым, а холостой бросили в бутылку из-под шампанского. Кох вместе с седым адвокатом Гарри Беллом взял четырёх коней на конном заводе «Кейндрафт», приехав на аметистовом «Понтиаке» Белла (ДО-6565), и заранее написал для журналиста статью «известный фокусник убил наповал политика Макса Хардмана».

  12 мая Джун взял коня Антуана на ячменной ферме (аренду устроил промоутер на имя Брауна). Около 17:00 все собрались у Южного кладбища, новичков с завязанными глазами повезли на станцию. Выстрел в Ядловски — холостой. Хардмана посадили на ящик под колоколом; второй выстрел — боевой: пуля ударила в рельс, потом в колокол и рикошетом попала Джуну в правый глаз. Конь понёс через лес и утром 13 мая принёс тело к ранчо «Боб и сыновья».

  Хардман объявил покушение, пригрозил «разобраться со всеми» и замял дело через связи в полиции. Пистолет спрятали в подвале станции, участники промолчали. Соперник Джуна, фокусник Маэстро Маззарри (Майкл Джералд), следивший за ним с помощником Мелвином Стэйлсом, нашёл пистолет и спрятал его в склепе Южного кладбища (участок 28). Ассистент Джуна Роджер Шеффилд украл его записи с секретами фокусов и сбежал. При обыске Кох пытался застрелиться; Белл исчез.

  Ключевой путь: лицо «знакомое» → реклама в газете → Театр оперетты (опознание) → тавро «колос в щите» → ячменная ферма → гостиница и обыск номера 402 (письмо Братства) → Маззарри → станция и криминалист (рикошет) → кладбище → Ядловски → Кох и обыск (черновик) → Хардман → конный завод → «Понтиак» → регистрация ТС → Гарри Белл.
