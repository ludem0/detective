rubric:
  - n: 1
    answer: "Джонатан Джун (настоящее имя Джонатан Браун), гастролирующий фокусник."
    full: "Имя."
  - n: 2
    answer: "Убить хотели не его. Лайонел Кох хотел, чтобы фокусник «случайно» убил заместителя мэра Макса Хардмана, и заранее подставил фокусника (черновик статьи)."
    full: "Цель — Хардман + подстава фокусника."
  - n: 3
    answer: "Собственный «Кольт» M1911 .45 Джуна: один холостой патрон заменён боевым; пуля срикошетила."
    full: "Пистолет Джуна + боевой патрон + рикошет."
  - n: 4
    answer: "Заброшенная ж/д станция в лесу (П-00/ЖД), у колокола, во время обряда посвящения."
    full: "Станция + колокол/обряд."
  - n: 5
    answer: "Лайонел Кох."
    full: "Кох."
  - n: 6
    answer: "Блондинка в «Амбассадоре» ночью подменила холостой патрон на боевой (холостой — в бутылке из-под шампанского). При выстреле в Хардмана пуля срикошетила от рельса и колокола и попала Джуну в правый глаз."
    full: "Подмена патрона + рикошет в глаз."
  - n: 7
    answer: "Письмо Братства → ужин в «Моби Дике» с дамой → джаз-клуб «77» → ночь в «Амбассадоре», подмена патрона → ферма, конь Антуан → сбор у Южного кладбища → станция: посвящение Ядловски (холостой), затем Хардмана (боевой) → рикошет → конь принёс тело на ранчо."
    full: "Цепочка от приглашения до выстрела."
  - n: 8
    answer: "Опасность — Хардману (заказчик на свободе). Привлечь: Коха (организатор); Гарри Белла (соучастник: «Понтиак», кони, бил в колокол); блондинку (подмена патрона); Маззарри (Майкла Джералда) и Стэйлса (спрятали орудие); Роджера Шеффилда (кража записей фокусов); членов Братства (скрыли смерть, спрятали пистолет)."
    full: "Все по именам. Без Белла и явного «членов Братства» — минус баллы."

debrief: |
  Закрытое «Братство» — клуб влиятельных людей, «бывших колонистов-железнодорожников» — собирается в подвале заброшенной железнодорожной станции в лесу (П-00/ЖД). Знак членов — тёмная гвоздика на лацкане. Братство письмом пригласило своего «брата», гастролирующего фокусника Джонатана Джуна (настоящее имя — Джонатан Браун), провести обряд посвящения: посвящаемый стоит под колоколом, читают Библию, Джун верхом стреляет из своего «Кольта» холостыми, седой брат бьёт палкой в колокол. Посвящались Джон Ядловски и заместитель мэра Макс Хардман.

  Лайонел Кох, соперник Хардмана в мэрии, решил убить его руками фокусника. Он знал порядок обряда: первым Ядловски, вторым Хардман. 11 мая Джун ужинал в «Моби Дике» с двумя джентльменами и блондинкой — той самой «занимательной особой» из письма, — потом был с ней в джаз-клубе «77» и провёл ночь в «Амбассадоре». Пока Джун спал (с пистолетом он расставался только во сне), второй холостой патрон в «Кольте» заменили боевым, а холостой бросили в бутылку из-под шампанского. Кох вместе с седым адвокатом Гарри Беллом взял четырёх коней на конном заводе «Кейндрафт», приехав на аметистовом «Понтиаке» Белла (ДО-6565), и заранее написал для журналиста статью «известный фокусник убил наповал политика Макса Хардмана».

  12 мая Джун взял коня Антуана на ячменной ферме (аренду устроил промоутер на имя Брауна). Около 17:00 все собрались у Южного кладбища, новичков с завязанными глазами повезли на станцию. Выстрел в Ядловски — холостой. Хардмана посадили на ящик под колоколом; второй выстрел — боевой: пуля ударила в рельс, потом в колокол и рикошетом попала Джуну в правый глаз. Конь понёс через лес и утром 13 мая принёс тело к ранчо «Боб и сыновья».

  Хардман объявил покушение, пригрозил «разобраться со всеми» и замял дело через связи в полиции. Пистолет спрятали в подвале станции, участники промолчали. Соперник Джуна, фокусник Маэстро Маззарри (Майкл Джералд), следивший за ним с помощником Мелвином Стэйлсом, нашёл пистолет и спрятал его в склепе Южного кладбища (участок 28). Ассистент Джуна Роджер Шеффилд украл его записи с секретами фокусов и сбежал. При обыске Кох пытался застрелиться; Белл исчез.

  Ключевой путь: лицо «знакомое» → реклама в газете → Театр оперетты (опознание) → тавро «колос в щите» → ячменная ферма → гостиница и обыск номера 402 (письмо Братства) → Маззарри → станция и криминалист (рикошет) → кладбище → Ядловски → Кох и обыск (черновик) → Хардман → конный завод → «Понтиак» → регистрация ТС → Гарри Белл.
