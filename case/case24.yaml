# Дело №24 «Зачарованный всадник» — сценарий для движка.
# СЕКРЕТНО: содержит ответы на все адреса и разгадку. Командам отдаётся только через API.
#
# entries   — ответы на поездки. address — как пишут игроки; движок сам нормализует
#             регистр, пробелы и дефисы. requires — адреса, без посещения которых ответ пустой.
# searches  — результат обыска: приходит сам через order_delay_sec после «адрес/ордер».
# triggers  — сообщения, которые приходят сами, когда команда посетила нужные адреса.

id: 24
title: Зачарованный всадник
case_time: "11:01, 13 мая 1955 года, пятница"

brief: |
  Солнце уже начинает греть, но атлантический ветер всё ещё холодный и пронизывающий. Вам должны перезвонить и подтвердить заказ на слежку за потенциально неверным мужем. И вот, звонок.

  — Алло. Стоун, — слышите вы хриплый голос. — Вам, кажется, понравилось работать за городом. Не понравилось? Ну, не обессудьте, но опять есть дело. Сегодня у нас тут пятница тринадцатое и начало дня в лучших традициях старого романа. Лошадь притащила тело на ранчо «Боб и сыновья». Езжайте туда, соберите информацию. Тело уже у коронера. Я, в общем, знаю, что могу на вас положиться. В полицию можете не ехать, потому что дело курирую я, — смеётся Стоун. — Личность пока не установили. Разберётесь, откуда этот зачарованный всадник к нам приехал и кто его так? Хорошо. К другим новостям: я тут улаживаю кое-какие вопросы, касающиеся вашего статуса. Вы в курсе, что у нас критическая нехватка кадров и бюджета нет, поэтому работаем с контрактниками типа вас. Ну так вот, может, бюджет будет. Ещё не знаю, коснутся ли вас эти изменения. Но репутация у вас пока хорошая. Поэтому хочу дать вам чуть больше полномочий. Условно. Если вам нужен будет ордер на обыск — езжайте в участок, постараемся выписать. Не подведите. Удачи.

  Кажется, детектив только что спихнул на вас очередное «глухое» дело вместе с ответственностью. Впрочем, как обычно. Вы берёте свои записи и, придерживая шляпы, выходите на ветреную улицу.

contacts:
  - "Коронер Уоллис — Центр судебной медицины, Ю-38."
  - "Криминалист Хоупс: чтобы вызвать криминалиста на место, добавьте /криминалист после адреса, например: АБ-12/криминалист."
  - "Обыск: добавьте /ордер после адреса, например: АБ-12/ордер. Учтите, что получение документов займёт время."

