entries:
  - address: П-96
    title: Ранчо «Боб и сыновья»
    text: |
      Ранчо встречает вас запахом сена и встревоженным ржанием. Хозяйство сменило владельцев всего несколько месяцев назад; вокруг — только холмы и леса. Хозяин, крепкий мужчина в выцветшей клетчатой рубашке, ведёт вас к загону.

      — Утром это было. Сын, Билл, пошёл скотину кормить, а у изгороди чужой конь. Пришёл с юга, вон оттуда, из-под холма. Всадник на нём свесился с седла, нога в стремени застряла. Дырка в голове — точно в глазу. Мы его сняли, позвонили куда следует, тело увезли. Вещи его мы не трогали, всё ушло вместе с ним.

      Конь вон стоит. Нервный, до сих пор успокоиться не может. Ухоженный, сытый — жирноват даже. Не рабочий, это я вам сразу скажу. На крупе тавро — вроде колос в щите.

      Откуда он? Да откуда угодно. Конезавод. Любая ферма — хотя, говорю же, конь не рабочий. Ипподром? Вряд ли: не скакун, тяжеловат. Ещё в музеях лошадей держат — у коренных американцев и у первых колонистов, для показа.

      Хозяин чешет затылок.

      — И знаете что… Лицо у него знакомое. Где-то я его видел, а где — не вспомню.

  - address: Ю-38
    title: Центр судебной медицины, коронер Уоллис
    appendices: [5, 10]
    text: |
      Коронер Уоллис отрывается от бумаг и снимает очки.

      — «И вот, конь бледный, и на нём всадник, которому имя смерть…» Откровение, глава шестая. Простите, профессиональное. Ваш всадник у меня.

      Пуля вошла неглубоко. Вещи при нём такие: костюм хорошего кроя, недешёвый. Ботинки городские — для верховой езды совсем не годятся. На лацкане головка тёмной гвоздики с белой лентой. В карманах около ста пятидесяти долларов, удостоверения нет. Расчёска, салфетки, портсигар с «Стеллионом».

      Уоллис протягивает вам папку с фотографией и отчётом о вскрытии и задумчиво добавляет:

      — Странное дело: лицо мне знакомо. Не по работе. Где-то я его видел.

  - address: ЮВ-44
    title: Театр оперетты
    text: |
      В фойе театра суета: рабочие тянут кабели, кто-то спорит о прожекторах. Менеджер гастролирующей труппы Майкл Ллойд, взглянув на фотографию, бледнеет.

      — Боже… Это Джонатан. Джонатан Джун. Наш магистр магии. У нас же премьера, билеты проданы!

      Он хватает телефонную трубку.

      — «Звёздный лес»? Номер четыреста два, Роджера, пожалуйста… Роджер, это Майкл. Джонатан мёртв. Да. Да! Тут детективы…

      Ллойд кладёт трубку и пытается взять себя в руки.

      — Нас немного. Леонард — свет и звук. Моника — ассистентка, она уехала в гостиницу. Роджер — помощник Джонатана. Ещё водитель и гримёр. Приехали одиннадцатого. Где Джонатан был всё это время? Понятия не имею. Он всегда пропадает. Знаете, у него стремление произвести впечатление выходит далеко за рамки профессии.

      Из-за кулис выглядывает худой человек с мотком провода — Леонард.

      — Если хотите знать, кто тут всё устраивал, спросите промоутера. Местный, Люк Нельсон. В «Тауэре», кабинет 51.

  - address: С-12/51
    title: Бизнес-центр «Престонс Тауэр», кабинет 51 — промоутер Люк Нельсон
    appendices: [4]
    text: |
      Кабинет промоутера завален афишами. Люк Нельсон, узнав новость, медленно опускается на стул.

      — Джун… Я же ему всё устроил. Всё как в райдере. Вот, смотрите сами.

      Он протягивает вам лист.

      — Лошадь? Да, на двенадцатое ему нужна была лошадь — чёрная, статная, всё как написано. Я арендовал на ячменной ферме, там у меня знакомые. Записал на его настоящее имя — Джонатан Браун. «Джун» — это для афиш.

      Площадка? Фокусники у нас обычно выступают в лаунджах. Но ему подошёл только Театр оперетты: нужен был люк в сцене, прожекторы, место для суфлёра… Требовательный был человек.

  - address: П-48
    title: Ячменная ферма «Хордигроу»
    appendices: [1]
    text: |
      Над воротами фермы деревянная арка, на ней щит с вырезанным колоском. Фермер в комбинезоне, не отрываясь от работы, кивает:

      — Аренда? Сдаём лошадей, кому покататься. Тут вот один взял коня и не вернул — Антуана, вороного. Да вы не волнуйтесь, Антуан умный, домой сам вернётся.

      Журнал можете посмотреть, у нас всё записано.

  - address: П-51
    title: Конный завод «Кейндрафт»
    appendices: [2]
    text: |
      Длинные белые конюшни, ухоженные выгулы. Управляющий отряхивает перчатки.

      — Мы вообще-то не прокат. Но договориться можно, если человек приличный. Все наши кони на месте, всех вернули, ни один не пропадал.

      Журнал? Пожалуйста. Если интересует конкретная запись — назовите номер строки, конюх расскажет подробнее.

      (Запрос по записи журнала: П-51/номер строки.)

  - address: П-51/87
    title: Конный завод «Кейндрафт», запись №87
    text: |
      Конюх, выдававший лошадей двенадцатого, хорошо помнит эту пару.

      — Эти? Приехали на машине, вдвоём. Один седой, одет хорошо, дорого. Второй высокий, с высоким лбом, усы такие пижонские. Каждый оседлал коня и ещё одного взял под уздцы — четыре коня на двоих. Машина у них — «Понтиак», цвет аметистовый, редкий. Номер простой, запомнился: из двух пар цифр. Каких — не скажу, врать не буду.

      Коней вернули в тот же день, около семи вечера.

  - address: ЮВ-38
    title: Ипподром
    text: |
      — Лошадей в аренду? Нет, это ипподром, у нас скаковые лошади, их никому не дают. И тавро у нас другое.

  - address: Ц-13
    title: Департамент регистрации транспортных средств
    requires: [П-51/87]
    appendices: [9]
    text: |
      Клерк выслушивает описание машины с конного завода.

      — «Понтиак» аметистового цвета? Что ж, «Понтиак» — не самая популярная машина в нашем городе, список будет недлинный. Вот все зарегистрированные у нас «Понтиаки». Дальше разбирайтесь сами.

  - address: Ц-46/3
    title: Гарри Белл
    text: |
      Дверь открывает седой мужчина в безупречном костюме — Гарри Белл, адвокат. Он смотрит на часы.

      — Лошади? Я не беру лошадей, господа, я езжу на автомобиле. Машина с похожим номером? Значит, видели не ту, в городе полно машин.

      У меня встреча, я опаздываю. Если у вас есть ко мне вопросы официального характера — присылайте повестку.

      Он надевает шляпу и уходит, оставив вас на пороге.

  - address: СЗ-37
    title: Гостиница «Звёздный лес»
    text: |
      Администратор гостиницы «Звёздный лес» листает книгу регистрации.

      — Труппа из театра? Да, заехали одиннадцатого. Мистер Джун — номер 504, отдельно, как просили. Мистер Метью Кокс и мистер Вильям Сталлард — 216. Мисс Моника МакКой — 215. Мистер Роджер Шеффилд — 402. Мистер Леонард Баддс и мистер Майкл Ллойд — 214.

      Если что-то понадобится, звоните на стойку: 50-01.

      (Номер в гостинице: СЗ-37/номер комнаты.)

  - address: СЗ-37/504
    title: «Звёздный лес», номер 504 — Джонатан Джун
    text: |
      Горничная отпирает номер 504. Открытый чемодан: уличная одежда и сценический костюм. На столе зажигалка, ножницы, графин с водой. Брошюры отеля и путеводители по городским достопримечательностям. Ручка — и ни одного листа бумаги. На полу у кровати стопкой лежат книги по физике.

  - address: СЗ-37/216
    title: «Звёздный лес», номер 216 — Метью Кокс и Вильям Сталлард
    text: |
      Водитель Метью Кокс и гримёр Вильям Сталлард играют в карты. Новость их ошарашивает.

      — Джонатан? — Кокс откладывает карты. — Прагматик до мозга костей. Говорил: магия — это инженерия, никакого волшебства, всё рассчитано. И любил сенсации.

      — Всегда возил с собой дневники, — добавляет Сталлард. — Там все его фокусы, схемы, расчёты. Берёг как зеницу ока.

      — И пистолет для номера с выстрелом. «Кольт», классический, семизарядный, сорок пятый калибр. Только холостые, всегда. Он с ним не расставался — разве что когда спал.

  - address: СЗ-37/215
    title: «Звёздный лес», номер 215 — Моника МакКой
    text: |
      Моника МакКой открывает не сразу. В номере пахнет джином, сама она едва держится на ногах и, кажется, не понимает, о чём вы говорите. Ничего связного добиться не удаётся. В номере ничего примечательного.

  - address: СЗ-37/402
    title: «Звёздный лес», номер 402 — Роджер Шеффилд
    text: |
      Дверь приоткрывается на цепочку. Молодой человек смотрит на вас настороженно.

      — Не пущу. Откуда я знаю, кто вы такие? Вдруг вы на Маззарри работаете! И вообще, я Джонатана не убивал, ясно? Уходите.

      Дверь захлопывается.

  - address: СЗ-37/214
    title: «Звёздный лес», номер 214 — Леонард Баддс и Майкл Ллойд
    text: |
      Хозяева номера в театре. Вещи аккуратно сложены, ничего интересного.

  - address: Ц-48/5001
    title: Телефонная станция — звонок на стойку «Звёздного леса»
    text: |
      Телефонистка соединяет вас со стойкой гостиницы.

      — Номер мистера Джуна? Да, минут за десять до вашего звонка туда заходил молодой человек. Серьёзный такой, с густой шевелюрой. Кажется, из их труппы.

  - address: В-89
    title: Клуб «Линдси Лаундж»
    text: |
      В «Линдси Лаундж» полумрак и саксофон. Управляющий, не вынимая сигареты изо рта, пожимает плечами:

      — Артистов у нас много, а настоящих имён они не любят. Назовите сценическое имя — посмотрю в контрактах.

      (Запрос по псевдониму: В-89/псевдоним без пробелов.)

  - address: В-89/маэстромаззарри
    aliases: [В-89/маззарри]
    title: Клуб «Линдси Лаундж» — Маэстро Маззарри
    text: |
      — Маэстро Маззарри? Выступает у нас. По контракту — Майкл Джералд. Итальянского в нём одно сценическое имя.

  - address: З-42
    title: Майкл Джералд (Маэстро Маззарри)
    text: |
      Майкл Джералд встречает вас в халате. Узнав, в чём дело, долго молчит, потом закуривает.

      — Да, я его ненавидел. Он разоблачил мой фокус с совой — публично. После этого меня не брали ни в один приличный зал. Я хотел отомстить, хотел поймать его на чём-нибудь — и следил за ним. Вместе с помощником, Мелвином Стэйлсом.

      Одиннадцатого он прилетел, мы ждали в аэропорту. Он взял такси на восточный променад. Потом вышел из джаз-клуба с дамой — и на такси в «Амбассадор».

      Двенадцатого около двух часов дня он был на ячменной ферме. Взял коня и поехал верхом к кладбищу. Там его ждали другие всадники, и все вместе они ушли в лес. Мы держались далеко.

      В лесу на заброшенной ветке — старая железнодорожная станция, минут пятнадцать по путям. Когда все разъехались, мы туда пошли. Там я нашёл его пистолет. Двух патронов не хватало. Я понял, что дело дрянь, — и мы его спрятали. В склепе на кладбище. Где именно — не помню, темно было, честное слово. Мелвин помнит лучше.

      (Старая станция — адрес П-00/ЖД.)

  - address: ЮЗ-70
    title: Мелвин Стэйлс
    text: |
      Мелвин Стэйлс нервно мнёт шляпу.

      — Мистер Джералд вам всё рассказал? Ну… да, мы следили. В гриме, чтобы Джун нас не узнал. Пистолет нашли в подвале станции, под тряпкой. Мистер Джералд сказал — спрячем, пока не разберёмся. Отвезли на Южное кладбище, в склеп. Номер участка не помню. Склеп на большом участке, недалеко от круглой дорожки.

  - address: В-62
    title: Ресторан «Моби Дик»
    text: |
      Штурвалы на стенах, гарпун над баром. Метрдотель вспоминает сразу:

      — Мистер Джун? Одиннадцатого вечером. Три джентльмена — он и ещё двое — и очаровательная леди. Столик на втором этаже. Потом мистер Джун с дамой ушли — собирались послушать джаз. Имён мы у гостей не спрашиваем.

  - address: В-77
    title: Джаз-клуб «77»
    appendices: [11]
    text: |
      Бармен полирует стакан.

      — Этот? Был, одиннадцатого. С блондинкой — не женщина, а фея. Она пила «Голубые Гавайи». Потом взяли такси и уехали в «Амбассадор», я слышал, как он называл адрес.

      Он ставит стакан на стойку.

      — А сразу после них заглянул один тип: брюнет, усищи рыжие — во! Спросил, куда ушла парочка, и выскочил. Подозрительный. Я его полицейскому художнику описал — вот, держите.

  - address: Ц-56
    title: «Амбассадор Резорт Инн»
    text: |
      Портье сверяется с журналом.

      — Мистер Джун и его спутница, блондинка, провели у нас ночь с одиннадцатого на двенадцатое. Утром выехали. Ночью к ним никто не поднимался: посторонних у нас не пускают.

      Горничная, убиравшая номер, вспоминает странность: в мусоре осталась бутылка из-под шампанского с широким горлышком, и внутри что-то звякнуло. Холостой патрон сорок пятого калибра.

  - address: П-98
    title: Кладбище Южное
    appendices: [3]
    text: |
      Сторож, старик в поношенном пальто, щурится на солнце.

      — Двенадцатого? Было дело. Часов в пять вечера у часовни собрались пятеро: трое верхом, двое пешком подошли. Один молодой, ухоженный. Другой высокий, с усами как у голливудских красавцев начала века. И Ядловски — этого я знаю, неделю назад его тётку здесь хоронили.

      Вот план кладбища, если нужно. Хотите осмотреть участок — назовите номер.

      (Запрос по участку: П-98/номер участка.)

  - address: П-98/28
    title: Кладбище Южное, участок 28 — склеп
    text: |
      На участке у круглой дорожки стоит старый каменный склеп. Дверь не заперта. В нише, под истлевшим венком, лежит пистолет: «Кольт» M1911, калибр .45. В обойме пять патронов из семи. Чтобы понять, стреляли ли из него, нужна экспертиза.

  - address: П-98/28/криминалист
    title: Криминалист Хоупс — пистолет из склепа
    text: |
      Криминалист Хоупс осматривает «Кольт» и выносит заключение: из этого пистолета был произведён боевой выстрел.

  - address: П-00/ЖД
    title: Заброшенная железнодорожная станция
    text: |
      Пятнадцать минут по заброшенной ветке через лес — и перед вами старая станция. Перрон зарос травой, на столбе висит латунный колокол. Земля вокруг истоптана копытами. На досках перрона бурые пятна, в траве поблёскивают две гильзы.

      В зале ожидания — люк в подвал. Внизу кирпичная комната, на стенах портреты мужчин середины прошлого века. Здесь явно кто-то собирается.

  - address: П-00/ЖД/криминалист
    title: Криминалист Хоупс — заброшенная станция
    appendices: [7]
    text: |
      Криминалист Хоупс несколько часов осматривает станцию, перрон и подвал и передаёт вам протокол осмотра.

  - address: В-58
    title: Джон Ядловски
    text: |
      Джон Ядловски долго не решается заговорить, потом машет рукой.

      — Ладно. Всё равно уже… Меня позвали в Братство. Закрытый клуб влиятельных людей — бывшие колонисты-железнодорожники, так они себя называют. Привёл меня Лайонел Кох. Новичков было двое: я и Макс. Нам завязали глаза и час везли верхом.

      Там нас было пятеро: я, Макс, Кох, седой какой-то с палкой — его я не знаю — и этот фокусник, Джун. Обряд такой: встаёшь под колокол, читают Библию, фокусник верхом стреляет в тебя — холостыми, конечно, — а седой бьёт в колокол. Проверка доверия. Кто за кем идёт, знал только Кох. Первым был я: выстрел, колокол — всё, я брат.

      Потом Макс. Выстрел — и будто два звука разом. Фокусник чуть не свалился, конь шарахнулся и понёс в лес, мы и опомниться не успели. Макс белый как мел: «Это покушение! Я со всеми разберусь!»

      Пистолет остался на земле. Я подобрал и отнёс в подвал, от греха подальше. Больше ничего не знаю, клянусь.

  - address: Ю-35
    title: Лайонел Кох
    text: |
      Роскошный особняк, дворецкий в белых перчатках. Лайонел Кох — высокий лоб, тонкие щегольские усы — принимает вас в кабинете и не предлагает сесть.

      — Лошадей? Да, брал. Конная прогулка с друзьями. Что в этом противозаконного?

      Он подходит ближе.

      — Вы, кажется, не понимаете, с кем разговариваете. Я — представитель власти этого города. Ещё один такой визит — и о вашей лицензии можно будет забыть. Всего доброго.

  - address: В-48
    title: Макс Хардман
    text: |
      Особняк заместителя мэра. Охранник выслушивает вас у ворот, уходит в дом и возвращается с ответом:

      — Мистер Хардман будет говорить только с теми, кто знает, где он был вчера.

      (Ответ: В-48/адрес.)

  - address: В-48/П-00/ЖД
    aliases: [В-48/П00ЖД]
    title: Макс Хардман
    text: |
      Охранник молча провожает вас в кабинет. Макс Хардман, крупный мужчина с тяжёлым взглядом, наливает себе виски.

      — Значит, знаете. Да, я там был. Меня пригласили вступить в Братство — железнодорожники, старые семьи города. Обряд дурацкий: посадили на ящик под колоколом, читали Библию. Фокусник верхом выстрелил — пуля ударила рядом со мной и рикошетом ушла в него самого. Он свалился с седла, конь понёс.

      Стреляли боевым, понимаете? Боевым! Меня заказали. Я сразу обратился к своим людям в полиции.

      Он достаёт из ящика конверт.

      — Здесь три тысячи. Считайте это авансом: найдите того, кто это устроил. И за молчание. Моего имени в газетах быть не должно.

  - address: Ц-30
    title: Мэрия
    text: |
      В приёмной мэрии суета. Секретарь, понизив голос, рассказывает:

      — Заместитель мэра, мистер Хардман, вчера не пришёл на благотворительный ужин, а ведь должен был вручать награду. Такого за ним не водилось. Говорят — только между нами, — у него в мэрии есть противник. Кто-то вредит его карьере. Чуть ли не убить готов. Кто — не знаю, правда.

  - address: Ю-88
    title: Книжный магазин «Атлантик» — Шелли Кеннет
    text: |
      Шелли Кеннет, не поднимая глаз от книги, выслушивает вас.

      — Журналы аренды, говорите? Снова вымышленные имена. Документы у нас почти нигде не спрашивают — пиши кого хочешь. Ищите людей не по именам, а по внешности. И по машинам.

searches:
  - address: Ц-46/3
    title: Обыск у Гарри Белла
    text: |
      Ордер подписан. Горничная, испуганно оглядываясь, впускает вас в квартиру. Мистер Белл так и не вернулся, куда ушёл — она не знает.

      В гардеробе висит костюм, на лацкане приколота тёмная гвоздика с белой лентой — точно такая же, как у покойного. Рядом брюки и сапоги для верховой езды в свежей, ещё не просохшей грязи.

  - address: СЗ-37/402
    title: Обыск в номере 402 — Роджер Шеффилд
    appendices: [6]
    text: |
      С ордером вы возвращаетесь в «Звёздный лес». Номер 402 пуст: Роджер Шеффилд сбежал, не осталось ни одежды, ни туалетных принадлежностей. Похоже, с собой он унёс и инструкции к фокусам Джонатана.

      В ящике стола — пачка писем от поклонников. Одно среди них выделяется: без обратного адреса, подписано «Ваши Братья».

  - address: Ю-35
    title: Обыск у Лайонела Коха
    appendices: [8]
    text: |
      С ордером вы возвращаетесь в особняк. Кох бледнеет, но молчит. В ящике письменного стола лежит черновик, озаглавленный «Журналисту».

      Пока вы читаете, Кох выхватывает из того же ящика пистолет — но целится не в вас, а подносит ствол к виску. Дворецкий успевает перехватить его руку. Кох оседает в кресло и закрывает лицо ладонями.

triggers:
  - id: lloyd-call
    address: ЮВ-44/звонок
    title: Звонок из Театра оперетты
    delay_sec: 60
    after_all: [ЮВ-44]
    after_any: [СЗ-37, СЗ-37/504, СЗ-37/216, СЗ-37/215, СЗ-37/402, СЗ-37/214, Ц-48/5001]
    text: |
      По рации вас разыскивает Майкл Ллойд из Театра оперетты.

      — Детективы? Я тут подумал… Может, это важно. У Джонатана в вашем городе был конкурент, местный фокусник. Они поссорились — из-за женщины, кажется. Тот грозился уничтожить Джонатану карьеру. Выступает под псевдонимом Маэстро Маззарри, настоящего имени я не знаю. Спросите там, где такие выступают.

hints:
