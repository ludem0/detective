events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json;

    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

    # Docker DNS: после пересборки у контейнера app новый IP, без resolver nginx отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        set $app http://app:8000;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /api/login {
            limit_req zone=login burst=30 nodelay;
            proxy_pass $app;
        }

        location / {
            limit_req zone=api burst=1000 nodelay;
            proxy_pass $app;
        }
    }
}
